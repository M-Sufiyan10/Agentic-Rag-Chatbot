[project]
name = "chatbot-backend"
version = "0.1.0"
description = "Portfolio LLM chatbot backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "pyjwt",
    "pwdlib[argon2]",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-ollama",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    "sse-starlette",
    "email-validator>=2.3.0",
    "ddgs>=9.16.1",
    "pgvector>=0.5.1",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "langchain-text-splitters>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langfuse>=5.2,<6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "asgi-lifespan",
    "ruff",
    "mypy",
    "numpy>=2.5.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
