[project]
name = "mcp-email"
version = "0.1.0"
description = "Email MCP server: read and send mail over IMAP/SMTP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp",
    "uvicorn",
    "pydantic",
    "starlette>=1.10.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
