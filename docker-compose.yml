services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U chatbot -d chatbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-utils:
    build: ./mcp-utils
    ports:
      - "127.0.0.1:8100:8100"

volumes:
  pgdata:
